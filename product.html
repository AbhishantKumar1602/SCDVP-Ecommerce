<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product – ShopX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/product.css" />
</head>
<body>

  <!-- LOADER -->
  <div class="page-loader" id="pageLoader">
    <div class="loader-ring"></div>
  </div>

  <!-- HEADER -->
  <header class="header" id="header">
    <div class="header-inner">
      <div class="logo" onclick="goHome()">
        <span class="logo-icon">✦</span>
        <span class="logo-text">Shop<em>X</em></span>
      </div>

      <div class="breadcrumb">
        <a href="index.html">Home</a>
        <span class="bc-sep">›</span>
        <a href="index.html">Products</a>
        <span class="bc-sep">›</span>
        <span class="bc-current" id="bcProduct">Product</span>
      </div>

      <nav class="header-actions">
        <span class="nav-btn orders" id="ordersBtn" style="display:none;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Orders
        </span>
        <span class="nav-btn cart" id="cartBtn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          Cart
          <span class="cart-badge" id="cartBadge">0</span>
        </span>
      </nav>
    </div>
  </header>

  <!-- PRODUCT PAGE -->
  <section class="product-page" id="productDetails">

    <!-- LEFT: IMAGE GALLERY -->
    <div class="product-images">
      <div class="main-image-wrap">
        <div class="main-image">
          <img id="mainProductImage" src="" alt="Product" />
        </div>
        <button class="img-wishlist" id="wishlistBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
        <div class="img-zoom-hint">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          Hover to zoom
        </div>
      </div>
      <div class="thumbnail-list" id="thumbnailList"></div>
    </div>

    <!-- RIGHT: PRODUCT INFO -->
    <div class="product-info">
      <div class="info-top">
        <span class="badge-brand" id="productBrand">Brand</span>
        <span class="badge-stock in-stock">● In Stock</span>
      </div>

      <h1 id="productTitle" class="product-title"></h1>

      <div class="rating-row">
        <div class="stars" id="productStars"></div>
        <span class="rating-num" id="productRatingNum"></span>
        <span class="rating-count" id="productRatingCount"></span>
      </div>

      <div class="price-row">
        <span class="price-main" id="productPrice"></span>
        <span class="price-old" id="productPriceOld"></span>
        <span class="price-discount" id="productDiscount"></span>
      </div>

      <p class="product-description" id="productDescription"></p>

      <!-- KEY FEATURES -->
      <div class="features" id="productFeatures"></div>

      <div class="divider"></div>

      <!-- QUANTITY -->
      <div class="qty-label">Quantity</div>
      <div class="quantity-row">
        <div class="qty-controls">
          <button class="qty-btn" id="decreaseQty">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/></svg>
          </button>
          <input type="text" class="qty-input" id="qtyInput" value="1" />
          <button class="qty-btn" id="increaseQty">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <span class="qty-note">Only 5 left in stock!</span>
      </div>

      <!-- ACTION BUTTONS -->
      <div class="actions">
        <button class="btn-cart" id="addToCartBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          Add to Cart
        </button>
        <button class="btn-buy" id="buyNowBtn">Buy Now</button>
      </div>

      <!-- PERKS -->
      <div class="perks">
        <div class="perk-item">
          <span class="perk-icon">🚚</span>
          <span>Free delivery on orders over ₹500</span>
        </div>
        <div class="perk-item">
          <span class="perk-icon">🔄</span>
          <span>Easy 30-day returns</span>
        </div>
        <div class="perk-item">
          <span class="perk-icon">🛡️</span>
          <span>Authentic & warranted product</span>
        </div>
      </div>
    </div>
  </section>

  <!-- RELATED PRODUCTS -->
  <section class="related-section">
    <div class="related-head">
      <h2>You might also like</h2>
    </div>
    <div class="related-grid" id="relatedGrid"></div>
  </section>

  <!-- BACK TO TOP -->
  <button class="back-to-top" id="backToTop">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 15l-6-6-6 6"/></svg>
  </button>

  <!-- TOAST CONTAINER -->
  <div class="toast-wrap" id="toastWrap"></div>

  <script src="js/product.js"></script>
  <script>
    function goHome() { window.location.href = "index.html"; }

    // Back to top
    const backToTop = document.getElementById("backToTop");
    window.addEventListener("scroll", () => {
      backToTop.classList.toggle("visible", window.scrollY > 500);
    });
    backToTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

    // Header scroll shadow
    window.addEventListener("scroll", () => {
      document.getElementById("header").classList.toggle("scrolled", window.scrollY > 10);
    });
  </script>
</body>
</html>
